config-version = 2

# Mouse follows focus when focused monitor changes
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[mode.main.binding]

alt-h = 'focus left'
alt-n = 'focus down'
alt-e = 'focus up'
alt-i = 'focus right'

alt-shift-h = 'move left'
alt-shift-n = 'move down'
alt-shift-e = 'move up'
alt-shift-i = 'move right'

alt-k = ['join-with left', 'mode main']
alt-m = ['join-with down', 'mode main']
alt-comma = ['join-with up', 'mode main']
alt-period = ['join-with right', 'mode main']

alt-j = 'fullscreen'
alt-l = 'layout v_accordion'
alt-u = 'layout tiles horizontal vertical'
alt-y = 'layout floating tiling'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-minus = 'workspace 11'
alt-equal = 'workspace 12'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'
alt-shift-minus = 'move-node-to-workspace 11'
alt-shift-equal = 'move-node-to-workspace 12'

ctrl-shift-minus = 'resize smart -50'
ctrl-shift-equal = 'resize smart +50'

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'
10 = 'main'
11 = 'main'
12 = 'main'

# Slack Huddle
# Specific Slack Huddle windows are handled first and stop here.
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
if.window-title-regex-substring = 'huddle'
run = ['move-node-to-workspace 9', 'layout tiling']
check-further-callbacks = false

# Slack
# Regular Slack windows fall through to this general Slack rule.
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 8', 'layout tiling']

# Chrome
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace 1', 'layout tiling']

# Ghostty
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace 2', 'layout tiling']

# Codex / Claude
[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = ['move-node-to-workspace 3', 'layout tiling']
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace 3', 'layout tiling']

# Zed
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace 4', 'layout tiling']

# GoLand
[[on-window-detected]]
if.app-id = 'com.jetbrains.goland'
run = ['move-node-to-workspace 5', 'layout tiling']

# MongoDB Compass / TablePro
[[on-window-detected]]
if.app-id = 'com.mongodb.compass'
run = ['move-node-to-workspace 6', 'layout tiling']
[[on-window-detected]]
if.app-id = 'com.TablePro'
run = ['move-node-to-workspace 6', 'layout tiling']

# Bruno
[[on-window-detected]]
if.app-id = 'com.usebruno.app'
run = ['move-node-to-workspace 7', 'layout tiling']

# Cliq
[[on-window-detected]]
if.app-id = 'com.zoho.cliq'
run = ['move-node-to-workspace 8', 'layout tiling']

# Proxyman
[[on-window-detected]]
if.app-id = 'com.proxyman.NSProxy'
run = ['move-node-to-workspace 10', 'layout tiling']

# Calendar
[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = ['move-node-to-workspace 11', 'layout tiling']

# Obsidian
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace 12', 'layout tiling']
